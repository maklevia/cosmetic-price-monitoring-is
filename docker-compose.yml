name: cosmetics-price-monitoring

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: cosmetics-backend:local
  env_file:
    - .env.docker
  environment:
    METRICS_PORT: ${METRICS_PORT:-9464}
  init: true

services:
  postgres:
    image: postgres:15-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  monitoring-init:
    image: postgres:15-alpine
    env_file:
      - .env.docker
    volumes:
      - ./docker/postgres/observability.sql:/observability.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        : "$${MONITORING_DB_PASSWORD:?MONITORING_DB_PASSWORD is required}"
        PGPASSWORD="$$DB_PASSWORD" psql \
          -h postgres \
          -U "$$DB_USER" \
          -d "$$DB_NAME" \
          -v monitoring_password="$$MONITORING_DB_PASSWORD" \
          -v main_db="$$DB_NAME" \
          -v auth_db="$$AUTH_DB_NAME" \
          -f /observability.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${MONITORING_DB_PASSWORD:-monitoring_password}@postgres:5432/${DB_NAME}?sslmode=disable"
    volumes:
      - ./docker/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    command:
      - --extend.query-path=/etc/postgres-exporter/queries.yaml
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres-exporter-auth:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring:${MONITORING_DB_PASSWORD:-monitoring_password}@postgres:5432/${AUTH_DB_NAME}?sslmode=disable"
    volumes:
      - ./docker/postgres-exporter/queries-auth.yaml:/etc/postgres-exporter/queries-auth.yaml:ro
    command:
      - --extend.query-path=/etc/postgres-exporter/queries-auth.yaml
    depends_on:
      monitoring-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - auth-service
      - postgres-exporter
      - postgres-exporter-auth
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.21.3
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  tempo-init:
    image: grafana/tempo:2.9.0
    user: root
    entrypoint: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo_data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  migrate:
    <<: *backend
    command:
      - sh
      - -c
      - |
        set -e
        node node_modules/typeorm/cli.js -d api/dist/config/data-source.js migration:run
        node node_modules/typeorm/cli.js -d auth-service/dist/config/data-source.js migration:run
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["node", "--import", "./api/dist/observability/tracing.js", "api/dist/entrypoints/api.js"]
    environment:
      METRICS_PORT: ${METRICS_PORT:-9464}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.API_PORT + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  auth-service:
    <<: *backend
    command: ["node", "--import", "./auth-service/dist/observability/tracing.js", "auth-service/dist/index.js"]
    environment:
      METRICS_PORT: ${METRICS_PORT:-9464}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: auth-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.AUTH_SERVICE_PORT + '/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        API_ORIGIN: ${API_ORIGIN:-/api}
        AUTH_ORIGIN: ${AUTH_ORIGIN:-/auth}
    image: cosmetics-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  scheduler:
    <<: *backend
    command: ["node", "--import", "./api/dist/observability/tracing.js", "api/dist/entrypoints/scheduler.js"]
    environment:
      METRICS_PORT: ${METRICS_PORT:-9464}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 20s
    restart: unless-stopped

  parser-worker:
    <<: *backend
    command: ["node", "--import", "./api/dist/observability/tracing.js", "api/dist/entrypoints/parser.js"]
    environment:
      METRICS_PORT: ${METRICS_PORT:-9464}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: parser-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 120s
    restart: unless-stopped

  notifier:
    <<: *backend
    command: ["node", "--import", "./api/dist/observability/tracing.js", "api/dist/entrypoints/notifier.js"]
    environment:
      METRICS_PORT: ${METRICS_PORT:-9464}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      OTEL_SERVICE_NAME: notifier
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  bot:
    <<: *backend
    command: ["node", "telegram-bot/dist/index.js"]
    profiles: ["bot"]
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
